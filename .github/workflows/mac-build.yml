name: Build macOS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install fastapi uvicorn pyinstaller

      # 🔧 BUILD (bez --onefile)
      - name: Build APP
        run: |
          pyinstaller run.py \
            --name run \
            --windowed \
            --onedir \
            --target-architecture universal2 \
            --hidden-import=anyio._backends._asyncio \
            --hidden-import=anyio._backends._trio \
            --collect-all anyio \
            --collect-all fastapi \
            --collect-all uvicorn \
            --collect-all starlette

      # 🚀 TEST jak prawdziwy user (open .app)
      - name: Test app start
        run: |
          open dist/run.app
          sleep 8
          curl -f http://127.0.0.1:8000/health

      - name: Zip app
        run: |
          cd dist
          zip -r run-macos.zip run.app

      - uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: dist/run-macos.zip
