name: Build macOS
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install fastapi uvicorn pyinstaller
      - name: Build APP
        run: |
          pyinstaller run.py --name run --windowed \
            --hidden-import=anyio._backends._asyncio \
            --hidden-import=anyio._backends._trio \
            --collect-all anyio \
            --collect-all fastapi \
            --collect-all uvicorn \
            --collect-all starlette \
            --onedir
      - name: Test app start
        run: |
          chmod +x dist/run.app/Contents/MacOS/run
          dist/run.app/Contents/MacOS/run &
          sleep 6
          curl -f http://127.0.0.1:8000/health
      - uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: dist/run.app
