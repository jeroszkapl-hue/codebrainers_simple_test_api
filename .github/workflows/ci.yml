name: CI

on:
  workflow_dispatch:

jobs:
  lint:
    name: Lint (Ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Ruff
        run: pip install ruff

      - name: Ruff check
        run: ruff check --output-format=github .

      - name: Ruff format check
        run: ruff format --check .

  typecheck:
    name: Type Check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install mypy

      - name: mypy
        run: mypy . --ignore-missing-imports

  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: pytest (with coverage gate)
        # tests/selenium is excluded here: it drives a real headless Chrome
        # browser, which this job doesn't provision. Run it separately/
        # locally, or add a dedicated job with Chrome available if it
        # should run in CI too.
        #
        # Coverage is scoped to main.py (the app logic) via
        # [tool.coverage.run] source in pyproject.toml; run.py is the
        # PyInstaller/uvicorn entrypoint and is exercised by the
        # build-macos/build-windows smoke tests instead. The 90% floor
        # (see [tool.coverage.report] fail_under) sits a few points below
        # the ~98% currently achieved, leaving headroom before this needs
        # revisiting.
        run: pytest --ignore=tests/selenium --cov=main --cov-report=term-missing

  security:
    name: Security (Bandit + pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install bandit pip-audit

      - name: Bandit
        run: bandit -r . -x ./.venv,./tests

      - name: pip-audit
        run: pip-audit -r requirements.txt

  build-macos:
    name: Build macOS
    needs: [lint, typecheck, test, security]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install fastapi uvicorn pyinstaller

      - name: Build APP
        run: |
          pyinstaller run.py \
            --name run \
            --windowed \
            --add-data "static:static" \
            --hidden-import=anyio._backends._asyncio \
            --hidden-import=anyio._backends._trio \
            --hidden-import=sqlite3 \
            --collect-all anyio \
            --collect-all fastapi \
            --collect-all uvicorn \
            --collect-all starlette
      - name: Test app start
        run: |
          chmod +x dist/run.app/Contents/MacOS/run
          dist/run.app/Contents/MacOS/run &
          sleep 6
          curl -f http://127.0.0.1:8000/health
          curl -f http://127.0.0.1:8000/
          curl -f http://127.0.0.1:8000/login
          curl -f http://127.0.0.1:8000/static/css/theme.css

          # Exercise the SQLite-backed employee storage end-to-end — a
          # packaged build is the one environment where a sqlite3
          # packaging issue (missing hidden import, wrong DB path
          # resolution under sys.frozen) would actually surface.
          TOKEN=$(curl -sf -X POST http://127.0.0.1:8000/api/login \
            -H "Content-Type: application/json" \
            -d '{"username": "admin", "password": "admin"}' \
            | python3 -c "import sys, json; print(json.load(sys.stdin)['access_token'])")
          curl -sf -X POST http://127.0.0.1:8000/api/employees \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $TOKEN" \
            -d '{"name": "Smoke Test", "salary": 5000, "age": 30, "position": "Mid QA", "on_leave": false}'
          curl -sf http://127.0.0.1:8000/api/employees -H "Authorization: Bearer $TOKEN" | grep -q "Smoke Test"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: dist/run.app

  build-windows:
    name: Build Windows
    needs: [lint, typecheck, test, security]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install fastapi uvicorn pyinstaller

      - name: Build EXE
        shell: powershell
        run: |
          pyinstaller run.py `
            --name run `
            --onefile `
            --windowed `
            --add-data "static;static" `
            --hidden-import=anyio._backends._asyncio `
            --hidden-import=anyio._backends._trio `
            --hidden-import=sqlite3 `
            --collect-all anyio `
            --collect-all fastapi `
            --collect-all uvicorn `
            --collect-all starlette
      - name: Test app start
        shell: powershell
        run: |
          Start-Process dist/run.exe
          Start-Sleep -Seconds 6
          Invoke-WebRequest http://127.0.0.1:8000/health -UseBasicParsing
          Invoke-WebRequest http://127.0.0.1:8000/ -UseBasicParsing
          Invoke-WebRequest http://127.0.0.1:8000/login -UseBasicParsing
          Invoke-WebRequest http://127.0.0.1:8000/static/css/theme.css -UseBasicParsing

          # Exercise the SQLite-backed employee storage end-to-end — a
          # packaged build is the one environment where a sqlite3
          # packaging issue (missing hidden import, wrong DB path
          # resolution under sys.frozen) would actually surface.
          $login = Invoke-RestMethod -Method Post -Uri http://127.0.0.1:8000/api/login `
              -ContentType "application/json" -Body '{"username": "admin", "password": "admin"}'
          $headers = @{ Authorization = "Bearer $($login.access_token)" }
          Invoke-RestMethod -Method Post -Uri http://127.0.0.1:8000/api/employees `
              -ContentType "application/json" -Headers $headers `
              -Body '{"name": "Smoke Test", "salary": 5000, "age": 30, "position": "Mid QA", "on_leave": false}'
          $employees = Invoke-RestMethod -Uri http://127.0.0.1:8000/api/employees -Headers $headers
          if (-not ($employees | Where-Object { $_.name -eq "Smoke Test" })) {
              throw "Smoke Test employee not found after creation"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: windows-app
          path: dist/run.exe

  tag-release:
    name: Tag Release
    needs: [build-macos, build-windows]
    # Only tag off main — a manual dispatch from a feature branch shouldn't
    # mint a release tag for a CHANGELOG.md entry that isn't on main yet.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need full history + existing tags to check for duplicates

      - name: Read version from the top of CHANGELOG.md
        id: version
        run: |
          VERSION=$(grep -m1 -oP '(?<=^## \[)[0-9]+\.[0-9]+\.[0-9]+(?=\])' CHANGELOG.md)
          if [ -z "$VERSION" ]; then
            echo "Could not find a '## [X.Y.Z]' heading at the top of CHANGELOG.md" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Tag and push, if this version isn't tagged yet
        env:
          TAG: v${{ steps.version.outputs.version }}
        run: |
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "$TAG already exists — nothing to do (CHANGELOG.md's top entry wasn't bumped since the last run)."
            exit 0
          fi

          # Pull this version's release notes straight out of CHANGELOG.md:
          # everything from its "## [X.Y.Z]" heading up to (not including)
          # the next one, so the tag message always matches the changelog.
          NOTES=$(awk '/^## \[/{if (found) exit; found=1; next} found' CHANGELOG.md)

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG" -m "$NOTES"
          git push origin "$TAG"
