name: Build Windows

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install fastapi uvicorn pyinstaller

      - name: Build EXE
        shell: powershell
        run: |
          pyinstaller run.py `
            --name run `
            --onefile `
            --windowed `
            --hidden-import=anyio._backends._asyncio `
            --hidden-import=anyio._backends._trio `
            --collect-all anyio `
            --collect-all fastapi `
            --collect-all uvicorn `
            --collect-all starlette
      - name: Test app start
        shell: powershell
        run: |
          Start-Process dist/run.exe
          Start-Sleep -Seconds 6
          Invoke-WebRequest http://127.0.0.1:8000/health -UseBasicParsing

      - uses: actions/upload-artifact@v4
        with:
          name: windows-app
          path: dist/run.exe