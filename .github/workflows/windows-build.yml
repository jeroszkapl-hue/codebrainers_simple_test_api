name: Build & Test Windows EXE

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install fastapi uvicorn pyinstaller

      - name: Build EXE
        run: |
          pyinstaller --onefile --noconsole run.py

      # 🔥 TEST CZY APLIKACJA DZIAŁA
      - name: Run EXE and test server
        shell: powershell
        run: |
          Start-Process dist/run.exe
          Start-Sleep -Seconds 6
          Invoke-WebRequest http://127.0.0.1:8000 -UseBasicParsing

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Windows-EXE
          path: dist/run.exe